name: Repository Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Static game tests and repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source syntax
        run: |
          node --check script.js
          node --check game-logic.js
          node --check scripts/validate-repository.mjs

      - name: Validate repository and local references
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Validate documentation and workflow files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md docs/README.md docs/gameplay.md docs/testing.md docs/known-issues.md docs/diagrams/README.md docs/runbooks/README.md docs/templates/README.md .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml .github/PULL_REQUEST_TEMPLATE.md .github/workflows/quality-checks.yml; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = [Path(".github/workflows/quality-checks.yml"), Path(".github/dependabot.yml")]
          files += list(Path(".github/ISSUE_TEMPLATE").glob("*.yml"))
          files += list(Path(".github/DISCUSSION_TEMPLATE").glob("*.yml"))
          for path in files:
              yaml.safe_load(path.read_text())
              print("Valid YAML:", path)
          PY
          find docs/diagrams -name '*.mmd' -type f -size +0c -print | grep .
