name: '🐛 Bug report'
description: Report a reproducible gameplay or browser issue
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Search existing issues first. Do not include personal data or secrets.'
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact keys and actions in order
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Safe console or network errors
      description: Remove secrets and personal information.
